<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>加解密工具 · 文档与工具</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="../../tool.css" />
  </head>
  <body class="tool-page" data-tool="crypto">
    <main>
      <header class="tool-header">
        <a href="../../#/tools" class="back-button">← 全部工具</a>
        <h1 class="tool-switch" aria-label="工具切换">
          <button type="button" data-mode="encoding" aria-pressed="false">
            编码转换
          </button>
          <button type="button" data-mode="digest" aria-pressed="false">
            摘要工具
          </button>
          <button type="button" data-mode="crypto" aria-pressed="true">
            加解密工具
          </button>
          <button type="button" data-mode="generator" aria-pressed="false">
            生成器
          </button>
        </h1>
        <span>浏览器本地处理</span>
      </header>
      <div id="tool-workspace" class="tool-workspace"></div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
