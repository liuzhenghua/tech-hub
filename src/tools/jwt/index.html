<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JWT 解析 · 文档与工具</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="../../tool.css" />
  </head>
  <body class="tool-page" data-tool="jwt">
    <main>
      <header class="tool-header">
        <a href="../../#tools" class="back-button">← 全部工具</a>
        <h1>工具</h1>
        <span>浏览器本地处理</span>
      </header>
      <div class="bottom-toolbar" hidden>
        <div class="toolbar">
          <label for="option" id="option-label">算法</label
          ><select id="option"></select
          ><select id="crypto-variant" aria-label="算法模式" hidden></select>
        </div>
      </div>
      <div id="sm2-controls" hidden>
        <label
          >SM2 密钥（Hex）
          <input id="sm2-key" placeholder="加密填公钥，解密填私钥" /></label
        ><label
          >密文编码
          <select id="sm2-format">
            <option>Hex</option>
            <option>Base64</option>
          </select></label
        ><label
          >密文 C1 前缀
          <select id="sm2-prefix">
            <option value="yes">含 04</option>
            <option value="no">不含 04</option>
          </select></label
        >
      </div>
      <div id="rsa-controls" hidden>
        <label for="rsa-key">RSA 密钥（本地保存）</label
        ><textarea
          id="rsa-key"
          rows="3"
          autocomplete="off"
          spellcheck="false"
          placeholder="加密：BEGIN PUBLIC KEY 公钥或公钥 JWK；解密：BEGIN PRIVATE KEY 私钥或私钥 JWK"
        ></textarea
        ><label for="rsa-format">密文编码</label>
        <select id="rsa-format">
          <option>Base64</option>
          <option>Hex</option>
        </select>
      </div>
      <div id="aes-controls" hidden class="aes-controls">
        <label
          >密钥编码
          <select id="aes-key-format">
            <option>Hex</option>
            <option>Base64</option>
            <option>UTF-8</option>
          </select></label
        ><label
          >密钥
          <input
            id="aes-key"
            autocomplete="off"
            placeholder="16 / 24 / 32 字节原始密钥" /></label
        ><button id="aes-generate-key">生成 256 位密钥</button
        ><label>IV（Hex） <input id="aes-iv" autocomplete="off" /></label
        ><button id="aes-generate-iv">生成 IV</button
        ><label
          >密文编码
          <select id="aes-format">
            <option>Base64</option>
            <option>Hex</option>
          </select></label
        >
      </div>
      <details class="verification-panel">
        <summary>签名校验（可选）</summary>
        <p>
          仅校验签名，不验证有效期、签发者或受众。解码结果不代表 Token 可信。
        </p>
        <div id="jwt-key-row" hidden>
          <label for="jwt-key">校验密钥</label
          ><textarea
            id="jwt-key"
            rows="2"
            wrap="soft"
            spellcheck="false"
            autocomplete="off"
            placeholder="HS：原始文本密钥；RS / PS / ES：PEM 公钥（BEGIN PUBLIC KEY）或公钥 JWK"
          ></textarea>
        </div>
        <div class="actions" id="actions"></div>
      </details>
      <div class="editors">
        <section class="editor">
          <div class="editor-head">
            <label for="input">JWT Token <small id="count"></small></label>
            <div class="editor-controls">
              <button
                id="input-wrap"
                aria-pressed="true"
                title="切换输入区自动换行"
              >
                Word wrap：开</button
              ><button id="clear">清空</button>
            </div>
          </div>
          <textarea
            id="input"
            wrap="soft"
            spellcheck="false"
            placeholder="粘贴 JWT（支持 Bearer 前缀），自动解析 Header 和 Payload…"
          ></textarea>
        </section>
        <section class="editor">
          <div class="editor-head">
            <label for="output">解析结果</label>
            <div class="editor-controls">
              <button id="markdown-toggle" hidden>HTML 源码</button>
              <div id="json-controls" hidden>
                <button id="tree-toggle" aria-pressed="true">文本视图</button>
                <button id="expand-all">全部展开</button>
                <button id="collapse-all">全部折叠</button>
              </div>
              <button id="copy">复制结果</button>
            </div>
          </div>
          <div id="jwt-info" hidden aria-live="polite"></div>
          <textarea
            id="output"
            readonly
            spellcheck="false"
            placeholder="解析结果会显示在这里"
          ></textarea>
          <div id="markdown-preview" class="markdown-body" hidden></div>
          <div
            id="json-tree"
            class="json-tree"
            aria-label="JSON 树形结果"
            hidden
          ></div>
        </section>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
      <footer>
        <span id="hint"></span>
        <span id="storage-note">内容自动保存在本机</span
        ><span>UTF-8 · 浏览器内处理 · 不上传</span>
      </footer>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
