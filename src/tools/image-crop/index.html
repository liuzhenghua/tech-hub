<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图片裁剪</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="../image-shared/style.css" />
  </head>
  <body class="image-tool-page">
    <main class="image-tools">
      <header class="tool-header">
        <a href="../../#/tools" class="back-button">← 全部工具</a>
        <h1 class="tool-switch" aria-label="工具切换">
          <a href="../image-crop/" aria-current="page">图片裁剪</a
          ><a href="../image-compress/">图片压缩</a>
        </h1>
        <span>浏览器本地处理 · 不上传图片</span>
      </header>
      <input
        id="file-input"
        type="file"
        accept="image/png,image/jpeg,image/webp"
        hidden
      />
      <section id="empty" class="image-empty">
        <div class="upload-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 8V4h4m8 0h4v4m0 8v4h-4M8 20H4v-4M4 12h16M12 4v16" />
          </svg>
        </div>
        <h2>把图片拖到这里</h2>
        <p>也可以选择文件，或直接粘贴剪贴板图片</p>
        <button id="choose-file" class="image-primary">选择图片</button
        ><small
          >PNG、JPEG、WebP · 单张最大 30 MB<br />最长边 ≤ 8192 px，总像素 ≤ 2400
          万；动画仅保留首帧</small
        >
        <div class="empty-features">
          <span>拖拽选区</span><span>固定比例</span><span>像素级微调</span>
        </div>
      </section>
      <section id="workspace" hidden>
        <div class="image-filebar">
          <div class="file-identity">
            <span class="file-icon"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M4 8V4h4m8 0h4v4m0 8v4h-4M8 20H4v-4M4 12h16M12 4v16"
                /></svg
            ></span>
            <div>
              <strong id="file-name"></strong><span id="file-meta"></span>
            </div>
          </div>
          <div class="file-actions">
            <button id="replace-file" class="image-secondary">更换图片</button
            ><button id="clear-file" class="image-quiet">移除</button>
          </div>
        </div>
        <div class="image-layout">
          <section class="image-preview-panel">
            <div class="preview-topline">
              <span>裁剪画布</span
              ><button id="reset-crop" class="image-quiet">重置选区</button>
            </div>
            <div class="crop-viewport">
              <div id="crop-stage" class="crop-stage checkerboard">
                <img id="source-image" alt="待裁剪图片" draggable="false" />
                <div
                  id="crop-selection"
                  class="crop-selection"
                  tabindex="0"
                  role="group"
                  aria-label="裁剪选区，使用方向键移动，Shift 加速"
                >
                  <span class="crop-grid" aria-hidden="true"></span
                  ><button
                    class="crop-handle handle-nw"
                    data-handle="nw"
                    aria-label="左上控制点，方向键微调"
                    type="button"
                  ></button
                  ><button
                    class="crop-handle handle-n"
                    data-handle="n"
                    aria-label="上控制点，方向键微调"
                    type="button"
                  ></button
                  ><button
                    class="crop-handle handle-ne"
                    data-handle="ne"
                    aria-label="右上控制点，方向键微调"
                    type="button"
                  ></button
                  ><button
                    class="crop-handle handle-e"
                    data-handle="e"
                    aria-label="右控制点，方向键微调"
                    type="button"
                  ></button
                  ><button
                    class="crop-handle handle-se"
                    data-handle="se"
                    aria-label="右下控制点，方向键微调"
                    type="button"
                  ></button
                  ><button
                    class="crop-handle handle-s"
                    data-handle="s"
                    aria-label="下控制点，方向键微调"
                    type="button"
                  ></button
                  ><button
                    class="crop-handle handle-sw"
                    data-handle="sw"
                    aria-label="左下控制点，方向键微调"
                    type="button"
                  ></button
                  ><button
                    class="crop-handle handle-w"
                    data-handle="w"
                    aria-label="左控制点，方向键微调"
                    type="button"
                  ></button
                  ><span
                    id="selection-size"
                    class="selection-size"
                    aria-hidden="true"
                  ></span>
                </div>
              </div>
            </div>
            <p class="canvas-hint">
              拖动画布新建选区 · 拖动选区移动 · 方向键微调，Shift + 方向键移动
              10 px
            </p>
          </section>
          <aside class="image-settings">
            <section class="settings-section">
              <h2>裁剪比例</h2>
              <div
                id="ratio-options"
                class="ratio-options"
                role="group"
                aria-label="裁剪比例"
              >
                <button data-ratio="0" aria-pressed="true">自由</button
                ><button data-ratio="-1" aria-pressed="false">原比例</button
                ><button data-ratio="1" aria-pressed="false">1:1</button
                ><button data-ratio="1.3333333333333333" aria-pressed="false">
                  4:3</button
                ><button data-ratio="1.7777777777777777" aria-pressed="false">
                  16:9</button
                ><button data-ratio="0.75" aria-pressed="false">3:4</button
                ><button data-ratio="0.5625" aria-pressed="false">9:16</button>
              </div>
            </section>
            <section class="settings-section">
              <div class="section-heading">
                <h2>选区尺寸</h2>
                <span>px</span>
              </div>
              <div class="coordinate-fields">
                <label
                  >宽度<input
                    id="crop-width"
                    type="number"
                    min="1"
                    step="1"
                    inputmode="numeric" /></label
                ><label
                  >高度<input
                    id="crop-height"
                    type="number"
                    min="1"
                    step="1"
                    inputmode="numeric" /></label
                ><label
                  >起点 X<input
                    id="crop-x"
                    type="number"
                    min="0"
                    step="1"
                    inputmode="numeric" /></label
                ><label
                  >起点 Y<input
                    id="crop-y"
                    type="number"
                    min="0"
                    step="1"
                    inputmode="numeric"
                /></label>
              </div>
            </section>
            <section class="settings-section">
              <h2>裁剪预览</h2>
              <div class="crop-thumbnail checkerboard">
                <canvas id="crop-preview" aria-label="裁剪结果预览"></canvas>
              </div>
              <p id="crop-output-size" class="setting-note"></p>
            </section>
            <section class="settings-section">
              <label class="setting-label" for="output-format">导出格式</label
              ><select id="output-format">
                <option value="image/png">PNG · 无损</option>
                <option value="image/webp">WebP · 更小体积</option>
                <option value="image/jpeg">JPEG · 通用格式</option>
              </select>
              <div id="crop-quality-control" hidden>
                <label class="range-label" for="crop-quality"
                  >质量 <output id="crop-quality-value">90</output></label
                ><input
                  id="crop-quality"
                  type="range"
                  min="10"
                  max="100"
                  value="90"
                />
              </div>
              <button id="download-crop" class="image-primary full-width">
                下载裁剪图片
              </button>
              <button id="copy-crop" class="full-width">复制图片</button>
              <p class="setting-note">
                复制当前选区，使用 PNG 保留画质与尺寸；保留 WebP/JPEG
                格式请下载。
              </p>
              <p id="crop-export-note" class="setting-note">
                导出移除图片元数据，PNG 保留透明背景。
              </p>
            </section>
          </aside>
        </div>
      </section>
      <p id="status" class="image-status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
