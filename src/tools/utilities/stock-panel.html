<div class="utility-columns">
  <section class="editor">
    <div class="editor-head"><h2>持仓信息</h2></div>
    <div class="utility-form">
      <label for="stock-buy">买入单价（元 / 股）</label>
      <input
        id="stock-buy"
        type="number"
        inputmode="decimal"
        min="0"
        step="any"
        placeholder="例如 22.75"
      />
      <label for="stock-shares">持仓股数（股）</label>
      <input
        id="stock-shares"
        type="number"
        inputmode="numeric"
        min="1"
        step="1"
        max="9007199254740991"
        placeholder="例如 500"
      />
      <label for="stock-amount">买入总额（元，可选）</label>
      <input
        id="stock-amount"
        type="number"
        inputmode="decimal"
        min="0"
        step="any"
        placeholder="例如 10000"
      />
      <p class="utility-hint">
        填入买入单价和股数即可算出买入总额。已知总额时也可直接填写，计算时以填写的总额为准。
      </p>
      <label for="stock-current">当前价（元 / 股）</label>
      <input
        id="stock-current"
        type="number"
        inputmode="decimal"
        min="0"
        step="any"
        placeholder="例如 23.26"
      />
      <button id="stock-add" type="button">添加成交记录</button>
    </div>
  </section>
  <section class="editor">
    <div class="editor-head"><h2>估算结果</h2></div>
    <div class="utility-form" aria-live="polite">
      <span class="utility-meta" id="stock-cost-label">买入总额</span>
      <output id="stock-cost" aria-labelledby="stock-cost-label">—</output>
      <span class="utility-meta" id="stock-rate-label">涨跌幅</span>
      <output id="stock-rate" aria-labelledby="stock-rate-label">—</output>
      <span class="utility-meta" id="stock-profit-label">浮动盈亏</span>
      <output id="stock-profit" aria-labelledby="stock-profit-label">—</output>
      <span class="utility-meta" id="stock-value-label">当前市值</span>
      <output id="stock-value" aria-labelledby="stock-value-label">—</output>
      <p class="utility-hint">
        未填股数时按投入金额全部买入估算。结果未计交易费用。
      </p>
    </div>
  </section>
</div>
<p id="stock-status" class="utility-status" role="status"></p>
<section class="editor">
  <div class="editor-head"><h2>成交记录</h2></div>
  <div class="utility-form" id="stock-records"></div>
</section>
