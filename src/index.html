<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>文档与工具</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header>
      <a id="site-brand" class="brand" href="#tools">文档与工具</a>
      <nav aria-label="主导航">
        <a id="nav-tools" href="#tools">工具</a
        ><a id="nav-docs" href="#docs">文档</a
        ><a href="https://github.com/liuzhenghua/tech-hub">GitHub ↗</a
        ><button
          id="lock"
          hidden
          title="锁定并清除本机保存的口令和文档缓存"
          aria-label="锁定并清除本机保存的口令和文档缓存"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true"
          >
            <rect x="5" y="10" width="14" height="11" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
          >锁定
        </button>
      </nav>
    </header>
    <main id="main-content" tabindex="-1">
      <section id="tools-page" class="tool-section">
        <div class="section-title">
          <h2>常用工具</h2>
          <span>在浏览器里，直接开始</span>
        </div>
        <div class="tools-grid">
          <a class="tool" href="%BASE_URL%tools/text-toolbox/index.html"
            ><div class="tool-top">
              <span class="tool-icon" aria-hidden="true">{ }</span
              ><span class="tool-badge">本地处理</span>
            </div>
            <h3>文本工具箱</h3>
            <p>
              格式化 JSON、解析 JWT、预览 Markdown，以及编码、摘要和加解密。
            </p>
            <div class="tool-bottom">
              <span>无需解锁 · 打开即用</span
              ><span class="tool-open">打开 ↗</span>
            </div></a
          >
        </div>
      </section>
      <section id="library" hidden>
        <div class="section-title">
          <h2>私有文档库</h2>
          <span id="total">私有文档</span>
        </div>
        <form id="unlock">
          <div>
            <h3>用你的口令，打开知识库。</h3>
            <p>在当前浏览器解密访问凭证，直接读取私有仓库。</p>
          </div>
          <label for="secret">解密口令</label>
          <div class="unlock-row">
            <input
              id="secret"
              type="password"
              autocomplete="off"
              required
              placeholder="输入云端访问口令"
            /><button id="submit">解锁文档</button>
          </div>
          <label class="remember"
            ><input
              id="remember"
              type="checkbox"
              checked
            />在此设备记住口令</label
          >
        </form>
        <p id="status" role="status" aria-live="polite"></p>
        <div id="workspace" hidden>
          <div id="doc-catalog">
            <div class="catalog-toolbar">
              <div id="categories" aria-label="文档分类"></div>
              <input
                id="search"
                type="search"
                placeholder="搜索文档名称或路径…"
                aria-label="搜索文档"
              />
            </div>
            <p id="results-count" class="results-count"></p>
            <div id="files" class="document-grid" aria-label="文档列表"></div>
          </div>
          <div id="doc-detail" hidden>
            <button id="back-to-docs" class="back-button">← 返回文档</button>
            <div class="reading-layout">
              <article>
                <div id="doc-head"></div>
                <div id="document"></div>
              </article>
              <aside id="outline" aria-label="本页目录" hidden></aside>
            </div>
          </div>
        </div>
      </section>
      <footer>
        <span id="footer-brand">文档与工具</span
        ><span>公开工具 · 私有知识 · 持续积累</span>
      </footer>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
