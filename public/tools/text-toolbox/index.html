ht:28px;margin-top:18px;font-size:14px;color:var(--accent)}#status.error{color:#ffadad}footer{border-top:1px solid var(--line);margin-top:26px;padding-top:20px;color:var(--muted);font-size:13px}@media(max-width:700px){main{padding:28px 16px}header{align-items:flex-start}.badge{display:none}h1{font-size:30px}.editors{grid-template-columns:1fr}textarea{min-height:240px}.toolbar span{margin-left:0}}

<div id="sm2-controls" hidden><label>SM2 密钥（Hex） <input id="sm2-key" placeholder="加密填公钥，解密填私钥"></label><label>密文编码 <select id="sm2-format"><option>Hex</option><option>Base64</option></select></label><label>密文 C1 前缀 <select id="sm2-prefix"><option value="yes">含 04</option><option value="no">不含 04</option></select></label></div><div id="rsa-controls" hidden><label for="rsa-key">RSA 密钥（本地保存）</label><textarea id="rsa-key" rows="3" autocomplete="off" spellcheck="false" placeholder="加密：BEGIN PUBLIC KEY 公钥或公钥 JWK；解密：BEGIN PRIVATE KEY 私钥或私钥 JWK"></textarea><label for="rsa-format">密文编码</label> <select id="rsa-format"><option>Base64</option><option>Hex</option></select></div><div id="aes-controls" hidden class="aes-controls"><label>密钥编码 <select id="aes-key-format"><option>Hex</option><option>Base64</option><option>UTF-8</option></select></label><label>密钥 <input id="aes-key" autocomplete="off" placeholder="16 / 24 / 32 字节原始密钥"></label><button id="aes-generate-key">生成 256 位密钥</button><label>IV（Hex） <input id="aes-iv" autocomplete="off"></label><button id="aes-generate-iv">生成 IV</button><label>密文编码 <select id="aes-format"><option>Base64</option><option>Hex</option></select></label></div><div id="jwt-info" hidden aria-live="polite"></div><div id="jwt-key-row" hidden><label for="jwt-key">校验密钥（可选）</label><textarea id="jwt-key" rows="2" wrap="soft" spellcheck="false" autocomplete="off" placeholder="HS：原始文本密钥；RS / PS / ES：PEM 公钥（BEGIN PUBLIC KEY）或公钥 JWK"></textarea></div><div class="bottom-toolbar"><div class="toolbar"><label for="option" id="option-label">算法</label><select id="option"></select><select id="crypto-variant" aria-label="算法模式" hidden></select><span id="hint"></span></div><div class="actions" id="actions"></div></div><div id="status" role="status" aria-live="polite"></div>

<script>
'use strict';
const $=id=>document.getElementById(id), encoder=new TextEncoder();
const decoder=new TextDecoder('utf-8',{fatal:true});
let theme='dark';try{const saved=localStorage.getItem('text-toolbox-theme');if(saved==='light'||saved==='dark')theme=saved}catch{}
document.documentElement.dataset.theme=theme;$('theme').value=theme;

function md5(bytes){
 const size=Math.ceil((bytes.length+9)/64)*64, buffer=new Uint8Array(size);buffer.set(bytes);buffer[bytes.length]=128;
 const view=new DataView(buffer.buffer), bits=BigInt(bytes.length)*8n;view.setUint32(size-8,Number(bits&0xffffffffn),true);view.setUint32(size-4,Number(bits>>32n),true);
 const shifts=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21];const constants=Array.from({length:64},(_,i)=>Math.floor(Math.abs(Math.sin(i+1))*2**32)|0);
 let state=[0x67452301,0xefcdab89,0x98badcfe,0x10325476];
 for(let offset=0;offset<size;offset+=64){let [a,b,c,d]=state;for(let i=0;i<64;i++){let f,g;if(i<16){f=(b&c)|(~b&d);g=i}else if(i<32){f=(d&b)|(~d&c);g=(5*i+1)%16}else if(i<48){f=b^c^d;g=(3*i+5)%16}else{f=c^(b|~d);g=7*i%16}const x=(a+f+constants[i]+view.getInt32(offset+g*4,true))|0,s=shifts[Math.floor(i/16)*4+i%4];a=d;d=c;c=b;b=(b+((x<<s)|(x>>>(32-s))))|0}state=state.map((v,i)=>(v+[a,b,c,d][i])|0)}
 return state.map(v=>Array.from({length:4},(_,i)=>((v>>>(i*8))&255).toString(16).padStart(2,'0')).join('')).join('');
}
function fromBase64(value){let normalized=value.replace(/\s/g,'');if(!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}(?:==)?|[A-Za-z0-9+/]{3}=?|)?$/.test(normalized))throw new Error('Base64 格式无效，请输入标准 Base64 字符串。');return Uint8Array.from(atob(normalized),c=>c.charCodeAt(0))}
const configs={
 json:{name:'JSON',label:'缩进',options:['2 个空格','4 个空格','Tab'],hint:'格式化或移除 JSON 中的多余空白',actions:[['格式化','format'],['修复并格式化','repair'],['压缩 JSON','minify']]},
 jwt:{name:'JWT',label:'算法',options:[],hint:'自动读取 Header.alg；解析无需密钥。签名校验不检查有效期或签发者。',actions:[['解析','parse'],['校验签名','verify']]},
 strings:{name:'字符串处理',label:'',options:[],hint:'转义不加外层引号；反转义自动去除外层双引号；与 CotEditor 三个字符串脚本一致',actions:[['escape_string','escape'],['unescape_string','unescape'],['single_to_double_quotes','quotes']]},
 markdown:{name:'Markdown',label:'',options:[],hint:'实时预览 · 支持 Mermaid、表格和任务列表 · 可切换 HTML 源码',actions:[['渲染','render']]},
 hash:{name:'密码工具',label:'算法',options:['AES','SHA','MD5','Base64','RSA','HMAC','国密','DES'],hint:'按原始 UTF-8 字节计算，保留空格和换行',actions:[['计算 Hash','hash']]},
};
let current=null,revision=0,busy=false,treeMode=true;
const toolStates=new Map();
let markdownSource=false;
function updateView(){const available=current==='json'&&$('output').value!=='';$('json-controls').hidden=!available;$('json-tree').hidden=!(available&&treeMode);$('output').hidden=(available&&treeMode)||(current==='markdown'&&!markdownSource);$('markdown-preview').hidden=current!=='markdown'||markdownSource;$('markdown-toggle').hidden=current!=='markdown';$('markdown-toggle').textContent=markdownSource?'预览':'HTML 源码';$('copy').textContent=current==='markdown'?(markdownSource?'复制 HTML':'复制富文本'):'复制结果';$('tree-toggle').textContent=treeMode?'文本视图':'树形视图';$('tree-toggle').setAttribute('aria-pressed',String(treeMode));$('expand-all').disabled=!treeMode;$('collapse-all').disabled=!treeMode}
function clearResult(){$('jwt-info').textContent='';$('jwt-info').hidden=true;$('output').value='';$('json-tree').replaceChildren();updateView()}
function renderJSON(value){
 const root=$('json-tree');root.replaceChildren();
 function node(key,value,depth){
  const container=value!==null&&typeof value==='object',element=document.createElement(container?'details':'div');
  const line=container?document.createElement('summary'):element;
  if(key!==null){const label=document.createElement('span');label.className='json-key';label.textContent=key+': ';line.append(label)}
  if(container){const array=Array.isArray(value),entries=Object.entries(value),meta=document.createElement('span');meta.className='json-meta';meta.textContent=(array?'Array':'Object')+' '+(array?'[':'{')+entries.length+(array?']':'}');line.append(meta);element.append(line);element.open=depth<2;
   const children=document.createElement('div');children.className='json-children';let built=false;
   function build(){if(built)return;built=true;for(const [k,v] of entries)children.append(node(array?k:JSON.stringify(k),v,depth+1));element.append(children)}
   element.addEventListener('toggle',()=>{if(element.open)build()});element.buildChildren=build;if(element.open)build();
  }else{const text=document.createElement('span');text.className='json-'+(value===null?'null':typeof value);text.textContent=JSON.stringify(value);line.append(text)}
  return element;
 }
 root.append(node(null,value,0));updateView();
}
$('tree-toggle').onclick=()=>{treeMode=!treeMode;updateView()};
$('expand-all').onclick=()=>{const expand=element=>{if(element.tagName==='DETAILS'){element.buildChildren();element.open=true}for(const child of element.children)expand(child)};expand($('json-tree'))};
$('collapse-all').onclick=()=>{$('json-tree').querySelectorAll('details').forEach(element=>element.open=false)};

function status(message,error=false){$('status').textContent=message;$('status').className=error?'error':''}
function captureToolState(){return {cryptoVariant:$('crypto-variant').value,markdownSource,info:$('jwt-info').textContent,input:$('input').value,output:$('output').value,option:$('option').value,treeMode,wrap:$('input-wrap').getAttribute('aria-pressed')==='true',message:busy?'':$('status').textContent,error:$('status').className==='error',tree:$('json-tree').firstChild,inputScroll:[$('input').scrollTop,$('input').scrollLeft],outputScroll:[$('output').scrollTop,$('output').scrollLeft]}}
const savedParameterIds=['jwt-key','aes-key','aes-iv','aes-key-format','aes-format','rsa-key','rsa-format','sm2-key','sm2-format','sm2-prefix'];
function saveToolContent(){
 if(current===null)return;
 toolStates.set(current,captureToolState());
 const states={};for(const [key,state] of toolStates){const {tree,...stored}=state;states[key]=stored}
 states._cryptoGroupsVersion=2;states._parameters=Object.fromEntries(savedParameterIds.map(id=>[id,$(id).value]));
 try{localStorage.setItem('text-toolbox-content',JSON.stringify(states));$('storage-note').textContent='内容自动保存在本机'}
 catch{$('storage-note').textContent='本地保存失败（可能空间不足），请复制重要内容'}
}
try{
 const saved=JSON.parse(localStorage.getItem('text-toolbox-content')||'{}');if(saved&&!saved._cryptoGroupsVersion&&saved.hash){const old=Number(saved.hash.option);if([6,7,8].includes(old)){saved.hash.option='6';if(old===7)saved.hash.cryptoVariant='SM3'}else if([9,10].includes(old))saved.hash.option='7'}for(const id of savedParameterIds){const value=saved?._parameters?.[id];if(typeof value==='string'&&($(id).tagName!=='SELECT'||Array.from($(id).options).some(option=>option.value===value)))$(id).value=value}if(saved?.hash&&!saved.hash.cryptoVariant){const old=['MD5','SHA-1','SHA-256','SHA-384','SHA-512','AES-GCM','AES-CBC','AES-CTR'][Number(saved.hash.option)];if(old){saved.hash.option=old==='MD5'?'2':old.startsWith('SHA')?'1':'0';saved.hash.cryptoVariant=old}}
 for(const key of Object.keys(configs)){const state=saved?.[key];if(state&&typeof state.input==='string'&&typeof state.output==='string')toolStates.set(key,{...state,inputScroll:Array.isArray(state.inputScroll)?state.inputScroll:[0,0],outputScroll:Array.isArray(state.outputScroll)?state.outputScroll:[0,0]})}
}catch{}
let saveTimer;document.addEventListener('input',event=>{clearTimeout(saveTimer);saveTimer=setTimeout(saveToolContent,250)});
document.addEventListener('click',()=>{clearTimeout(saveTimer);saveTimer=setTimeout(saveToolContent,250)});
document.addEventListener('change',()=>{clearTimeout(saveTimer);saveTimer=setTimeout(saveToolContent,250)});
window.addEventListener('pagehide',saveToolContent);
function selectTool(key){
 if(!Object.hasOwn(configs,key))return;
 try{localStorage.setItem('text-toolbox-tab',key)}catch{}
 if(current===key)return;
 saveToolContent();
 current=key;revision++;$('jwt-key-row').hidden=key!=='jwt';$('option-label').hidden=key==='jwt'||key==='strings'||key==='markdown';$('option').hidden=key==='jwt'||key==='strings'||key==='markdown';const cfg=configs[key];document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.key===key)));$('option-label').textContent=cfg.label;$('option').replaceChildren(...cfg.options.map((s,i)=>new Option(s,String(i))));$('hint').textContent=cfg.hint;$('actions').replaceChildren(...cfg.actions.map(([name,action],i)=>{const button=document.createElement('button');button.textContent=name;button.className=i===0?'primary':'';button.onclick=()=>run(action);button.disabled=busy;return button}));if(typeof reuse!=='undefined')$('actions').append(reuse);const saved=toolStates.get(key);$('jwt-info').textContent=saved?.info??'';$('jwt-info').hidden=key!=='jwt'||!saved?.info;
 $('input').value=saved?.input??'';$('output').value=saved?.output??'';$('option').value=saved?.option??'0';treeMode=saved?.treeMode??true;markdownSource=saved?.markdownSource??false;
 const wrap=saved?.wrap??true;$('input-wrap').setAttribute('aria-pressed',String(wrap));$('input-wrap').textContent='Word wrap：'+(wrap?'开':'关');$('input').wrap=wrap?'soft':'off';$('input').style.whiteSpace=wrap?'pre-wrap':'pre';$('input').style.overflowWrap=wrap?'anywhere':'normal';
 $('count').textContent=`· ${encoder.encode($('input').value).length.toLocaleString()} 字节`;
 $('json-tree').replaceChildren();if(key==='json'&&saved?.tree)$('json-tree').append(saved.tree);else if(key==='json'&&saved?.output){try{renderJSON(JSON.parse(saved.output))}catch{clearResult()}}updateView();
 $('input').scrollTop=saved?.inputScroll[0]??0;$('input').scrollLeft=saved?.inputScroll[1]??0;$('output').scrollTop=saved?.outputScroll[0]??0;$('output').scrollLeft=saved?.outputScroll[1]??0;
 updateCryptoControls(saved?.cryptoVariant);if(key==='markdown')renderMarkdown();status(saved?.message??'',saved?.error??false);
}
for(const [key,cfg] of Object.entries(configs)){const button=document.createElement('button');button.textContent=cfg.name;button.dataset.key=key;button.setAttribute('role','tab');button.setAttribute('aria-controls','actions');button.onclick=()=>selectTool(key);document.querySelector('nav').append(button)}
async function verifyJWT(parts,header,keyMaterial){
 const expected=header.alg;
 if(typeof expected!=='string'||!/^(?:HS|RS|PS|ES)(?:256|384|512)$/.test(expected))throw new Error('不支持的签名算法：'+String(expected));
 if(!globalThis.crypto?.subtle)throw new Error('当前环境不支持 Web Crypto，请使用现代浏览器。');
 if(header.crit!==undefined||header.b64===false)throw new Error('不支持含 crit 或未编码 Payload 的 JWT。');
 if(!parts[2])throw new Error('Token 没有签名。');
 if(!keyMaterial)throw new Error('请填写校验密钥。');
 const family=expected.slice(0,2),bits=Number(expected.slice(2)),hash='SHA-'+bits;
 const name=family==='HS'?'HMAC':family==='RS'?'RSASSA-PKCS1-v1_5':family==='PS'?'RSA-PSS':family==='ES'?'ECDSA':null;
 if(!name)throw new Error('不支持该签名算法。');
 const algorithm=name==='ECDSA'?{name,namedCurve:({256:'P-256',384:'P-384',512:'P-521'})[bits]}:{name,hash};

async function transform(tool,action,value,option,keyMaterial='',aesParams={}){const bytes=encoder.encode(value);

 if(tool==='hash'&&option?.startsWith('HMAC-'))return hmacTransform(option,value,aesParams);
 if(tool==='hash'&&option?.startsWith('SM2-'))return sm2Transform(option,action,value,aesParams);

async function run(action){if(busy)return;const token=revision,tool=current,value=$('input').value,option=current==='hash'?selectedCryptoAlgorithm():$('option').value,keyMaterial=$('jwt-key').value;busy=true;$('actions').querySelectorAll('button').forEach(b=>b.disabled=true);status('处理中…');try{const result=await transform(tool,action,value,option,keyMaterial,{sm2Key:$('sm2-key').value,sm2Format:$('sm2-format').value,sm2Prefix:$('sm2-prefix').value,rsaKey:$('rsa-key').value,rsaFormat:$('rsa-format').value,key:$('aes-key').value,keyFormat:$('aes-key-format').value,iv:$('aes-iv').value,format:$('aes-format').value});if(token!==revision)return;const output=tool==='jwt'?result.output:result;$('output').value=output;if(tool==='jwt'){const lines=['工具信息（不属于 JWT 原始内容）',action==='verify'?`签名校验：${result.signatureVerified?'成功':'失败'} · 算法：${result.algorithm}`:'签名校验：未执行'];for(const [key,time] of Object.entries(result.times))lines.push(`${key}（UTC）：${time}`);$('jwt-info').textContent=lines.join('\n');$('jwt-info').hidden=false}if(tool==='json')renderJSON(JSON.parse(result));else if(tool==='markdown')paintMarkdown(result);else updateView();if(tool==='jwt'&&action==='verify'){const verified=result.signatureVerified;status(verified?'签名校验成功（未检查有效期、签发者和受众）':'签名校验失败：签名与密钥不匹配',!verified)}else status(`${tool==='json'&&action==='repair'?'启发式修复完成，请核对字符串内容':'完成'} · 输出 ${output.length.toLocaleString()} 个 UTF-16 字符`)}catch(error){if(token!==revision)return;clearResult();status('处理失败：'+error.message,true)}finally{busy=false;saveToolContent();$('actions').querySelectorAll('button').forEach(b=>b.disabled=false)}}

function formatPEM(value){
 const match=value.trim().match(/^-----BEGIN PUBLIC KEY-----([\s\S]*?)-----END PUBLIC KEY-----$/);

 const body=match[1].replace(/\\r\\n|\\n|\\r/g,'').replace(/\s/g,'');

}
